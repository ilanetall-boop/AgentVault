[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentvault"
version = "0.1.0"
description = "Persistent Memory for AI Agents — Give your AI agents a brain that remembers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "AgentVault Contributors"},
]
keywords = ["ai", "agents", "memory", "llm", "persistent-memory", "vector-store"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.100.0,<1.0",
    "uvicorn[standard]>=0.20.0,<1.0",
    "faiss-cpu>=1.7.0,<2.0",
    "sentence-transformers>=2.2.0,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.19.0,<1.0",
    "msgpack>=1.0,<2.0",
    "typer>=0.9.0,<1.0",
    "rich>=13.0,<14.0",
    "httpx>=0.24.0,<1.0",
    "numpy>=1.24.0,<3.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0,<3.0"]
postgres = ["asyncpg>=0.28.0,<1.0", "psycopg2-binary>=2.9,<3.0"]
qdrant = ["qdrant-client>=1.6.0,<3.0"]
all = ["agentvault[openai,postgres,qdrant]"]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-asyncio>=0.21,<1.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.1.0,<1.0",
    "mypy>=1.5,<2.0",
    "httpx>=0.24.0,<1.0",
]

[project.scripts]
agentvault = "agentvault.cli.main:app"

[project.urls]
Homepage = "https://github.com/agentvault/agentvault"
Documentation = "https://github.com/agentvault/agentvault/tree/main/docs"
Repository = "https://github.com/agentvault/agentvault"
Issues = "https://github.com/agentvault/agentvault/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.hatch.build.targets.wheel]
packages = ["agentvault"]
